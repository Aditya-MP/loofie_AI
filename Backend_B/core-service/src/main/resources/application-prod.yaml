# Production profile. Every environment-specific value comes from an environment variable: no
# secrets or hostnames live in the repository. The app refuses to start if a required one is missing.
spring:
  datasource:
    url: ${CORE_DB_URL}                 # e.g. jdbc:postgresql://db-host:5432/core_db?sslmode=require
    username: ${CORE_DB_USER}
    password: ${CORE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${CORE_DB_POOL_SIZE:20}

# JSON logs (Elastic Common Schema) so a log platform can search them; every line carries requestId.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

management:
  server:
    port: ${MANAGEMENT_PORT:8091}       # metrics and probes on a separate port, never exposed publicly

# Backend A. AI_FEEDBACK_URL and AI_FEEDBACK_API_KEY are optional on purpose: without them events wait in the
# outbox (alert: loofie.outbox.oldest.age.seconds) and are sent once they are set. Nothing is lost.
loofie:
  ai-feedback:
    require-https: true                 # an http URL or a URL without a key stops the app at start
  # F1 login. Without LOOFIE_OTP_PEPPER and LOOFIE_TOTP_KEY the app refuses to start. Until an SMS / email provider is
  # chosen (MSG91 after DLT registration; Postmark or SES), sender stays "none": OTP requests answer 503, no fake send.
  identity:
    otp-pepper: ${LOOFIE_OTP_PEPPER}
    totp-key: ${LOOFIE_TOTP_KEY}
    dev-secrets: false
    cookie-secure: true
    allowed-origins: ${LOOFIE_APP_ORIGINS}         # e.g. https://app.loofie.in
    app-base-url: ${LOOFIE_APP_BASE_URL:https://app.loofie.in}
    bootstrap-founder-email: ${LOOFIE_BOOTSTRAP_FOUNDER_EMAIL:}   # first founder only; remove after first start
