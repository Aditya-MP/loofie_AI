server:
  port: 8081
  shutdown: graceful            # finish in-flight requests before stopping (deploys, scale-down)
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB

spring:
  application:
    name: core-service
  threads:
    virtual:
      enabled: true             # Java 25 virtual threads; the DB pool below is the real concurrency limit
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true # let a running relay/timer batch finish on shutdown
        await-termination-period: 25s
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000  # ms; a request waits at most 5s for a connection, then gets a 503
      max-lifetime: 1800000     # 30 min, below typical server / proxy idle cut-offs
      data-source-properties:
        # Safety nets: no stuck query, lock wait or forgotten transaction can hold a connection forever.
        options: "-c statement_timeout=10000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Migrations run with the pool's 10s statement timeout. A migration that legitimately runs long
    # (an index build on a big table) starts with:
    #   SET LOCAL statement_timeout = 0; SET LOCAL lock_timeout = '10s';
    # SET LOCAL ends with the migration's transaction, so the pooled connection keeps its safety nets.
    # (Do not use spring.flyway.init-sqls for this: it would leave a pooled connection with no timeout.)
loofie:
  outbox:
    relay:
      enabled: true
      poll-interval: 500ms
      batch-size: 200           # with max-in-flight 32: measured 1,145 events/s at 20 ms per request (100: 959)
      send-timeout: 10s
      max-in-flight: 32         # requests open at once to Backend A (FastAPI runs sync handlers on 40 threads)
    monitor-interval: 15s
  # Backend A POST /ai/feedback. Empty url or key = not configured here: the relay waits, rows are sent once it is.
  ai-feedback:
    base-url: ${AI_FEEDBACK_URL:}
    api-key: ${AI_FEEDBACK_API_KEY:}
    connect-timeout: 2s
    request-timeout: 5s         # below send-timeout
  timers:
    enabled: true
    poll-interval: 30s
    batch-size: 100
  api:
    # Every transition needs an Idempotency-Key when true. OPS_EXTEND always needs one.
    # Switch on in prod once the apps send keys.
    require-idempotency-key: false
  queries:
    # Ops-console reads are fenced so a slow screen can never take connections from the engine
    # (measured: unfenced list queries failed the whole service at 50 rps). At most 13 of the 20 pooled connections.
    list-max-concurrent: 5     # heavy list queries
    detail-max-concurrent: 8   # single-job reads (index lookups); 5 + 8 leaves 7+ of 20 connections for the engine
    queue-wait: 1s
    statement-timeout: 2s
  retention:
    enabled: true
    interval: 10m
    outbox: 7d
    outbox-parked: 30d
    idempotency-keys: 24h
    notifications: 90d
  pricing:
    # Stored on each order when the brand pays (DECISIONS.md section 4). Basis points: 1500 = 15%.
    loofie-fee-bp: 1500
    gst-bp: 1800
  deadlines:
    # Brand video review: empty = 120 calendar hours (Foundation v2, today); 5 = working days (DECISIONS.md).
    # Switch on only after the founder signs off the change.
    review-working-days:
  calendar:
    # National holidays a full year should have. 3 = only the fixed days (26 Jan, 15 Aug, 2 Oct). Once ops delivers
    # the real list, set it to that list's national count so a half-entered year raises HOLIDAYS_MISSING.
    expected-national-per-year: 3
  refunds:
    daily-summary: true       # 09:00 India time, yesterday's refunds to the founder's inbox

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness for the platform
      show-details: never
  metrics:
    tags:
      application: core-service
