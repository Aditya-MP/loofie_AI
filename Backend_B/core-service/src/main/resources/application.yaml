server:
  port: 8081
  shutdown: graceful            # finish in-flight requests before stopping (deploys, scale-down)
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB

spring:
  application:
    name: core-service
  autoconfigure:
    # Spring Security is here for CSRF, CORS and headers only; login is our own (identity package). No generated user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true             # Java 25 virtual threads; the DB pool below is the real concurrency limit
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true # let a running relay/timer batch finish on shutdown
        await-termination-period: 25s
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000  # ms; a request waits at most 5s for a connection, then gets a 503
      max-lifetime: 1800000     # 30 min, below typical server / proxy idle cut-offs
      data-source-properties:
        # Safety nets: no stuck query, lock wait or forgotten transaction can hold a connection forever.
        options: "-c statement_timeout=10000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=60000"
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Migrations run with the pool's 10s statement timeout. A migration that legitimately runs long
    # (an index build on a big table) starts with:
    #   SET LOCAL statement_timeout = 0; SET LOCAL lock_timeout = '10s';
    # SET LOCAL ends with the migration's transaction, so the pooled connection keeps its safety nets.
    # (Do not use spring.flyway.init-sqls for this: it would leave a pooled connection with no timeout.)
loofie:
  outbox:
    relay:
      enabled: true
      poll-interval: 500ms
      batch-size: 200           # with max-in-flight 32: measured 1,145 events/s at 20 ms per request (100: 959)
      send-timeout: 10s
      max-in-flight: 32         # requests open at once to Backend A (FastAPI runs sync handlers on 40 threads)
    monitor-interval: 15s
  # Backend A POST /ai/feedback. Empty url or key = not configured here: the relay waits, rows are sent once it is.
  ai-feedback:
    base-url: ${AI_FEEDBACK_URL:}
    api-key: ${AI_FEEDBACK_API_KEY:}
    connect-timeout: 2s
    request-timeout: 5s         # below send-timeout
  timers:
    enabled: true
    poll-interval: 30s
    batch-size: 100
  api:
    # Every transition needs an Idempotency-Key when true. OPS_EXTEND always needs one.
    # Switch on in prod once the apps send keys.
    require-idempotency-key: false
  queries:
    # Ops-console reads are fenced so a slow screen can never take connections from the engine
    # (measured: unfenced list queries failed the whole service at 50 rps). At most 13 of the 20 pooled connections.
    list-max-concurrent: 5     # heavy list queries
    detail-max-concurrent: 8   # single-job reads (index lookups); 5 + 8 leaves 7+ of 20 connections for the engine
    queue-wait: 1s
    statement-timeout: 2s
  retention:
    enabled: true
    interval: 10m
    outbox: 7d
    outbox-parked: 30d
    idempotency-keys: 24h
    notifications: 90d
    audit-log: 365d             # F1 audit log: CERT-In needs 180 days, DPDP 1 year
  storage:
    # F1 round C (decision C1): S3-compatible file storage for screenshots (later F6 photos, F7 videos).
    # none = uploads answer 503 until the bucket exists; s3 = AWS S3 Mumbai or Cloudflare R2.
    mode: ${LOOFIE_STORAGE_MODE:none}
    endpoint: ${LOOFIE_STORAGE_ENDPOINT:}     # https://s3.ap-south-1.amazonaws.com or https://<account>.r2.cloudflarestorage.com
    region: ${LOOFIE_STORAGE_REGION:ap-south-1} # R2: auto
    bucket: ${LOOFIE_STORAGE_BUCKET:}
    path-style: ${LOOFIE_STORAGE_PATH_STYLE:false} # true for R2 / MinIO
    access-key: ${LOOFIE_STORAGE_ACCESS_KEY:}
    secret-key: ${LOOFIE_STORAGE_SECRET_KEY:}
  media:
    # F7 (D2): FFmpeg inside core-service as a queued background worker. The production image must include ffmpeg,
    # ffprobe and a TrueType font (DejaVuSans by default on Linux). If any is missing the worker does not start and
    # uploaded videos wait in the queue (nothing is lost); the log says what is missing.
    ffmpeg: ${LOOFIE_FFMPEG:ffmpeg}
    ffprobe: ${LOOFIE_FFPROBE:ffprobe}
    font-file: ${LOOFIE_MEDIA_FONT:}
    threads: 2                  # a 60 s 1080x1920 video previews in about 17 s on 2 threads
    max-concurrent: 1           # videos at once per instance (CPU heavy)
    poll-interval: 3s
    probe-timeout: 30s
    transcode-timeout: 10m
    lease: 20m                  # a video claimed by a crashed worker is taken again after this
    worker-enabled: true
    retention-interval: 30m     # D9 sweep: removes videos whose retention ended
  creators:
    # F1 round C. Categories = Backend A's list (decision C3); the pilot niche adds more.
    categories: [beauty_skincare, personal_care, other]
    require-bookable-to-accept: true # decision C6: incomplete, paused, blocked or deleted creators cannot accept work
  identity:
    # F1 round A (docs/features/f1-identity-round-a.md). Limits agreed 2026-11-17.
    sender: none                # none = SMS/email refused with a 503 until a provider exists; local/tests: log
    otp-pepper: ${LOOFIE_OTP_PEPPER:}   # base64, 32+ bytes; the app does not start without it (except dev-secrets)
    totp-key: ${LOOFIE_TOTP_KEY:}       # base64, exactly 32 bytes (AES-256)
    dev-secrets: false
    notice-version: "2026-11-draft"     # change when the lawyer-reviewed terms and privacy notice go live
    cookie-secure: true
    allowed-origins: []                 # e.g. https://app.loofie.in
    app-base-url: https://app.loofie.in
    bootstrap-founder-email: ${LOOFIE_BOOTSTRAP_FOUNDER_EMAIL:}
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-per-destination15m: 3
    otp-per-destination-day: 10
    otp-per-ip15m: 100
    verify-per-ip15m: 200
    mfa-per-user15m: 5
    sms-daily-cap: 5000          # about Rs 1,000-1,500 a day; above this texts pause and ops is told
    user-session-idle: 30d
    user-session-absolute: 90d
    staff-session: 12h
    mfa-session-ttl: 10m
    invite-ttl: 7d
  pricing:
    # Stored on each order when the brand pays (DECISIONS.md section 4). Basis points: 1500 = 15%.
    loofie-fee-bp: 1500
    gst-bp: 1800
  deadlines:
    # Brand video review: empty = 120 calendar hours (Foundation v2, today); 5 = working days (DECISIONS.md).
    # Switch on only after the founder signs off the change.
    review-working-days:
  calendar:
    # National holidays a full year should have. 3 = only the fixed days (26 Jan, 15 Aug, 2 Oct). Once ops delivers
    # the real list, set it to that list's national count so a half-entered year raises HOLIDAYS_MISSING.
    expected-national-per-year: 3
  refunds:
    daily-summary: true       # 09:00 India time, yesterday's refunds to the founder's inbox

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness for the platform
      show-details: never
  metrics:
    tags:
      application: core-service
