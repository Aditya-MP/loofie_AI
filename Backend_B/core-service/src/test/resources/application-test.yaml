# Tests run against the local core_db but in their own schema, so dev data is never touched.
# The schema is wiped and re-migrated at the start of every test run (see TestSupportConfig).
# Kafka is an embedded broker started by @IntegrationTest, not the WSL one.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/core_db?currentSchema=core_test
  flyway:
    schemas: core_test
    clean-disabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      properties:
        max.block.ms: 3000          # fail fast on unknown topics in relay failure tests
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000

loofie:
  outbox:
    relay:
      enabled: false                # tests call OutboxRelay.publishBatch() directly
      send-timeout: 5s
  kafka:
    retry:
      initial-interval: 50ms
      multiplier: 1.0
