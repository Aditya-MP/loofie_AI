# Tests run against the local core_db but in their own schema, so dev data is never touched.
# The schema is wiped and re-migrated at the start of every test run (see TestSupportConfig).
# Backend A is a fake HTTP server started by TestSupportConfig (FakeAiService), not the real one.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/core_db?currentSchema=core_test
  flyway:
    schemas: core_test
    clean-disabled: false

loofie:
  outbox:
    relay:
      enabled: false                # tests call OutboxRelay.publishBatch() directly
      send-timeout: 5s
  ai-feedback:
    base-url: ""                    # the real sender stays unconfigured; tests send to FakeAiService
  timers:
    enabled: false                  # tests call DeadlineWorker.runOnce() directly
  retention:
    enabled: false                  # tests call RetentionJob.runOnce() directly
  refunds:
    daily-summary: false            # tests call RefundSummary.sendYesterday() directly
