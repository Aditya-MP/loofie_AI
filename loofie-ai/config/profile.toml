# Profile Builder settings. Change values here, not in code. Every change gets a new version string
# so stored profiles show which settings produced them.

version = "profile-v1"

[text]
# Below this many characters of bio + captions, no niche is predicted.
min_chars = 20
# A typed category ("Fitness") is short but clean, so it needs less.
min_chars_category_raw = 3
# Captions used per creator (newest first).
max_captions = 10
# The bio describes the creator on purpose, so it counts as this many captions.
bio_weight = 2.0

[niche]
version = "niche-zeroshot-v2"
# Softmax temperature over cosine similarities. Lower = more decisive.
temperature = 0.02
# Below this top probability the prediction is stored but marked unsure.
unsure_below = 0.45

# Each label is described by a few phrases. A creator's text is compared with them.
# Sub-niches map to a Loofie category; every other label means category "other".
[niche.labels.skincare]
category = "beauty_skincare"
phrases = [
  "skincare routine and product reviews for acne, oily skin, sunscreen, serum, moisturiser",
  "honest skincare reviews, glowing skin tips, face wash, pigmentation",
  "dermatologist skincare tips, niacinamide, vitamin C serum, retinol",
]
