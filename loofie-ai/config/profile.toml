[language]
version = "lang-rules-v1"
# Fewer signals than this and the caption language is left blank.
min_signals = 3
# Unicode ranges for Indian scripts. Devanagari is counted as Hindi.
scripts = { Kannada = [0x0C80, 0x0CFF], Hindi = [0x0900, 0x097F], Tamil = [0x0B80, 0x0BFF], Telugu = [0x0C00, 0x0C7F], Malayalam = [0x0D00, 0x0D7F] }

# Distinctive romanized words. Avoid words that are also common English.
[language.words]
Kannada = ["namma", "nimma", "nodi", "nodu", "beku", "beda", "illa", "chennagide", "chennagi", "hegide", "maadi", "swalpa", "yenu", "houdu", "howdu", "banni", "gottilla", "sakkath", "sakath", "bombat", "kannadathi", "kannadiga", "nange", "ninge", "yaake", "thumba", "sumne", "aytu", "aithu", "kelsa", "oota", "maga", "guru"]
