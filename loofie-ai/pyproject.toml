[project]
name = "loofie-ai"
version = "0.1.0"
description = "Loofie AI service: brief reader, creator profiles, quality check, matcher"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.15",
    "sentence-transformers>=6.3",
    "transformers>=5.23",
    "scikit-learn>=1.9",
    "numpy>=2.5",
    "openpyxl>=3.1.5",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "alembic>=1.20",
    "httpx>=0.28",
    "cryptography>=46",
]

[project.scripts]
loofie = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

# CUDA 13.2 build of torch. Supports Turing (GTX 16xx, RTX 20xx) and newer.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job (ruff format)

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["F401", "I001", "E501"]  # generated by alembic
"tests/*" = ["B008"]
