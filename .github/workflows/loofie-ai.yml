# Runs the AI service's linter and full test suite on every push to backend-a and every PR that
# touches it. GPU tests skip here (no GPU on GitHub's runners); everything else runs, against a
# real PostgreSQL 18 + pgvector.
name: loofie-ai

on:
  push:
    branches: [backend-a]
    paths: ["loofie-ai/**", ".github/workflows/loofie-ai.yml"]
  pull_request:
    paths: ["loofie-ai/**", ".github/workflows/loofie-ai.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: loofie-ai
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: loofie
          POSTGRES_PASSWORD: loofie_dev
          POSTGRES_DB: loofie_ai
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U loofie -d loofie_ai"
          --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://loofie:loofie_dev@localhost:5433/loofie_ai
      TEST_DATABASE_URL: postgresql+psycopg://loofie:loofie_dev@localhost:5433/loofie_ai_test
      DEVICE: cpu
      AI_API_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: loofie-ai/uv.lock
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q
